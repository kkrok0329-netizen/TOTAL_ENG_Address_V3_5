<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TOTAL ENG 현장주소</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#003D8E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="현장주소" />
</head>
<div id="settingModal" class="setting-modal">

    <div class="setting-box">

        <h2>⚙ 앱 설정</h2>
        <button id="darkToggleBtn">🌙 다크모드 켜기/끄기</button>

        <div class="setting-item">
            📍 등록현장
            <span id="settingCount">73개</span>
        </div>

        <div class="setting-item">
            📦 버전
            <span>V3.6</span>
        </div>

        <button id="refreshCacheBtn">
            🔄 캐시 새로고침
        </button>

        <button id="closeSettingBtn">
            닫기
        </button>

    </div>

</div>
<body>
  <div id="splash" class="splash">
    <img src="img/logo.png" alt="TOTAL ENG" />
    <strong>현장주소</strong>
    <span>Loading...</span>
  </div>

  <div class="app">
    <header class="app-header">
      <div class="header-top">
        <img src="img/logo.png" class="logo" alt="TOTAL ENG" />
        <div class="header-actions">
          <button id="installBtn" class="icon-btn install-btn" type="button" hidden>설치</button>
          <button id="darkModeBtn" class="icon-btn" type="button" aria-label="다크모드">🌙</button>
        </div>
      </div>
      <h1>현장주소</h1>
      <p>AS · 공사 현장관리</p>
      <div id="headerCount" class="header-count">불러오는 중...</div>
    </header>

    <section class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" type="text" placeholder="현장명 또는 주소 검색" autocomplete="off" />
        <button id="clearBtn" type="button">✕</button>
      </div>
    </section>

    <section id="favoriteTopBox" class="favorite-top-box"></section>

    <nav class="tabs">
      <button class="tab active" data-type="all" type="button">전체</button>
      <button class="tab" data-type="general" type="button">일반현장</button>
      <button class="tab" data-type="coupang" type="button">쿠팡</button>
      <button class="tab" data-type="favorite" type="button">즐겨찾기</button>
      <button class="tab" data-type="recent" type="button">최근방문</button>
    </nav>

    <section class="summary-row">
      <span id="countText">전체 0개</span>
      <button id="refreshBtn" type="button">새로고침</button>
    </section>
<section id="favoriteTopBox" class="favorite-top-box"></section>
    <main id="siteList" class="site-list"></main>

    <footer class="app-footer">
  <div>TOTAL ENG 현장주소 <strong>V3.6</strong></div>
  <div id="appInfoText">등록 현장 0개 · 최종 업데이트 -</div>
</footer>

    <footer class="app-footer">
      <span id="versionText">V3.5.0</span>
      <span id="updatedText">업데이트 확인 중</span>
    </footer>
  </div>

  <div id="detailModal" class="detail-modal" aria-hidden="true">
    <div class="detail-box">
      <button id="closeDetailBtn" class="close-detail" type="button">✕</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
